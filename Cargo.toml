[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/tfaucher/oarfish"
authors = ["Toby Faucher <toby@tfaucher.com>"]

[workspace.dependencies]
# internal
oarfish-core   = { path = "crates/oarfish-core" }
oarfish-mask   = { path = "crates/oarfish-mask" }
oarfish-drain  = { path = "crates/oarfish-drain" }
oarfish-jev    = { path = "crates/oarfish-jev" }
oarfish-store  = { path = "crates/oarfish-store" }
oarfish-ingest = { path = "crates/oarfish-ingest" }
oarfish-engine = { path = "crates/oarfish-engine" }
oarfish-api    = { path = "crates/oarfish-api" }

# runtime
tokio        = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-util   = { version = "0.7", features = ["codec", "time", "rt", "io"] }
tokio-stream = "0.1"
futures      = "0.3"
bytes        = "1"

# data
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "1.1"
time       = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
blake3     = "1"
ulid       = { version = "3", features = ["serde", "std"] }
regex      = "1"

# storage
fjall = "3.1"
moka  = { version = "0.12", features = ["future"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }

# http
axum       = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["trace", "fs", "cors"] }
reqwest    = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }

# ingest
syslog_loose        = "0.23"
tonic               = { version = "0.14", features = ["server", "codegen", "router"] }
prost               = "0.14"
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "logs"] }
governor            = "0.10"

# cli + diagnostics
clap               = { version = "4", features = ["derive", "env"] }
anyhow             = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console-subscriber = "0.5"
tracing-appender   = "0.2"
figment            = { version = "0.10", features = ["env"] }
indicatif          = "0.18"
clap_complete      = "4"

# board type generation
ts-rs = "12"

# dev only
insta     = { version = "1", features = ["glob", "json"] }
wiremock  = "0.6"
criterion = { version = "0.8", features = ["async_tokio"] }
rstest    = "0.27"
proptest  = "1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = true
