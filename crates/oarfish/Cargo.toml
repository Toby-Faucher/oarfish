[package]
name = "oarfish"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
oarfish-core.workspace   = true
oarfish-mask.workspace   = true
oarfish-drain.workspace  = true
oarfish-jev.workspace    = true
oarfish-store.workspace  = true
oarfish-ingest.workspace = true
oarfish-engine.workspace = true
oarfish-api.workspace    = true
tokio.workspace              = true
clap.workspace               = true
toml.workspace               = true
serde.workspace              = true
anyhow.workspace             = true
tracing.workspace            = true
tracing-subscriber.workspace = true
console-subscriber = { workspace = true, optional = true }

[features]
default = []
# Runtime debugging via tokio-console. Also needs RUSTFLAGS="--cfg tokio_unstable".
console = ["dep:console-subscriber"]
