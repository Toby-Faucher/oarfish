[package]
name = "oarfish-ingest"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
oarfish-core.workspace  = true
oarfish-mask.workspace  = true
oarfish-drain.workspace = true
oarfish-store.workspace = true
tokio.workspace        = true
tokio-stream.workspace = true
syslog_loose.workspace = true
bytes.workspace        = true
time.workspace         = true
thiserror.workspace    = true
tracing.workspace      = true
tokio-util.workspace          = true
tonic.workspace               = true
prost.workspace               = true
opentelemetry-proto.workspace = true
governor.workspace            = true

systemd = { version = "0.10", optional = true }

[features]
default = []
# systemd journal reading, via libsystemd FFI. Off for portable builds;
# the daemon rejects --journal without it rather than silently ignoring it.
journald = ["dep:systemd"]

[dev-dependencies]
insta.workspace      = true
proptest.workspace   = true
rstest.workspace     = true
serde_json.workspace = true
wiremock.workspace   = true
oarfish-jev.workspace = true
