name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # `cargo test` regenerates the board's bindings. If that produced a diff,
      # someone changed a shared type and did not commit the TypeScript, which is
      # exactly the drift `ts-rs` is here to prevent. We check both modified
      # tracked files (`git diff`) and new untracked ones (`git status`) — a
      # brand-new exported type would only show up as untracked.
      - name: bindings are up to date
        run: |
          git diff --exit-code -- web/src/lib/bindings \
            || { echo "::error::web/src/lib/bindings is stale. Run 'cargo test --workspace' and commit the result."; exit 1; }
          [ -z "$(git status --porcelain --untracked-files=all -- web/src/lib/bindings)" ] \
            || { echo "::error::web/src/lib/bindings has untracked files. Run 'cargo test --workspace' and commit the result."; exit 1; }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
