# Third-party log corpora, fetched on demand and never committed.
#
# Sources: loghub    - https://github.com/logpai/loghub
#          loghub-2.0 - https://github.com/logpai/loghub-2.0 (same licence)
#
# The loghub datasets are made "freely available for research or academic work",
# and the project asks that any use or distribution cite the repository URL
# above. That is narrower than this repository's MIT licence, so oarfish does
# not redistribute them: this manifest records where they came from and what
# they should hash to, and `scripts/fetch-corpus.sh` downloads them into a
# gitignored directory on the machine that wants them.
#
# The `_templates.csv` files carry loghub's ground-truth templates. M1 does not
# use them; M2 compares the Drain port against them.
#
# The loghub-2.0 entries are the corrected 2k samples: all 14 systems, each a
# raw `.log` plus a `_structured_corrected.csv` carrying the ground-truth
# template of every line (row N is line N). oarfish-drain's `loghub2` test
# scores the port against them with loghub-2.0's own GA and FGA.

